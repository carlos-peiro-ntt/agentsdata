schema: spec-driven

context: |
  Read AGENTS.md and .github/instructions/dashboard.instructions.md before
  drafting or implementing any artifact; they are the governing source for
  data source, privacy, data-quality, and Confluence publishing rules.
  Source all dashboard data from the Supabase MCP in read-only mode; never
  fall back to resources/ CSVs or invented values.
  Never display or expose first name, last name, email, date of birth,
  postal code, or any field identifying a natural person.
  Keep the dashboard a single self-contained HTML file with no new external
  dependencies unless explicitly approved.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
